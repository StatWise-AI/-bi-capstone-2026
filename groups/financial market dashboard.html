<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multi-Asset Market Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
:root{
  --bg-deep:#f7f7f5;
  --bg-panel:#ffffff;
  --bg-panel-2:#f4f2ec;
  --accent-1:#b8842e;
  --accent-2:#8a6218;
  --accent-glow: rgba(184,132,46,0.20);
  --text-main:#1c1d1f;
  --text-dim:#767a82;
  --line:#e5e3dc;
  --up:#2e9e63;
  --down:#c8434f;
  --font-display: 'Georgia', 'Iowan Old Style', serif;
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'SF Mono', 'Courier New', monospace;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(184,132,46,0.05), transparent 60%),
    radial-gradient(900px 500px at 100% 0%, rgba(138,98,24,0.04), transparent 55%),
    var(--bg-deep);
  color:var(--text-main);
  font-family:var(--font-body);
  padding:28px;
  min-height:100vh;
  transition:background .3s ease;
}
.wrap{max-width:1280px;margin:0 auto;}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
  padding-bottom:20px;
  border-bottom:1px solid var(--line);
  flex-wrap:wrap;
  gap:16px;
}
.header-left{display:flex;align-items:center;gap:16px;}
.bar-icon{
  width:52px;height:52px;border-radius:12px;
  background:linear-gradient(160deg, var(--accent-1), var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 24px var(--accent-glow);
  flex-shrink:0;
  transition:background .3s ease;
}
.title-block h1{
  font-family:var(--font-display);
  font-size:26px;
  letter-spacing:0.5px;
  margin:0;
  color:var(--text-main);
}
.title-block .sub{
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-top:3px;
}
.asof{text-align:right;font-size:12px;color:var(--text-dim);}
.asof .price{font-family:var(--font-mono);font-size:22px;color:var(--accent-1);font-weight:600;}
.asof .chg{font-size:13px;margin-left:6px;}
.chg.pos{color:var(--up);}
.chg.neg{color:var(--down);}

.asset-tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
.asset-tab{
  padding:10px 20px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg-panel);color:var(--text-dim);font-size:14px;font-weight:600;
  cursor:pointer;transition:all .15s ease;display:flex;align-items:center;gap:8px;
}
.asset-tab:hover{border-color:var(--accent-1);color:var(--text-main);}
.asset-tab.active{
  background:linear-gradient(160deg, var(--accent-1), var(--accent-2));
  color:#fff;border-color:transparent;
}
.asset-tab .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5;}

.filters{
  display:flex;gap:28px;align-items:center;background:var(--bg-panel);
  border:1px solid var(--line);border-radius:14px;padding:16px 24px;margin-bottom:22px;flex-wrap:wrap;
}
.filter-group{display:flex;flex-direction:column;gap:6px;}
.filter-group label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);font-weight:600;}
.filter-group select{
  background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text-main);
  padding:8px 14px;border-radius:8px;font-size:14px;font-family:var(--font-body);min-width:140px;cursor:pointer;
}
.filter-group select:focus{outline:2px solid var(--accent-2);}
.range-note{margin-left:auto;font-size:12px;color:var(--text-dim);font-family:var(--font-mono);}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:22px;}
.kpi-card{
  background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;position:relative;overflow:hidden;transition:border-color .2s ease;
}
.kpi-card:hover{border-color:var(--accent-2);}
.kpi-card .label{
  font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);
  font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;
}
.kpi-card .value{font-family:var(--font-mono);font-size:30px;font-weight:600;color:var(--text-main);}
.kpi-card .value.accent{color:var(--accent-1);}
.kpi-card .foot{font-size:12px;color:var(--text-dim);margin-top:6px;}
.kpi-icon{width:22px;height:22px;opacity:0.85;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px 14px;}
.panel-title{font-size:14px;font-weight:600;letter-spacing:0.5px;color:var(--text-main);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.panel-title .tag{font-size:10px;color:var(--accent-1);border:1px solid var(--accent-2);border-radius:20px;padding:2px 10px;letter-spacing:1px;text-transform:uppercase;}
.chart-box{position:relative;height:260px;}
.wide{grid-column:1 / -1;}
.footer-note{text-align:center;color:var(--text-dim);font-size:11px;margin-top:22px;letter-spacing:0.5px;}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .grid{grid-template-columns:1fr;}
  .header{flex-direction:column;align-items:flex-start;gap:14px;}
  .asof{text-align:left;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="header-left">
      <div class="bar-icon" id="barIcon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="14" width="4" height="7" rx="1" fill="#ffffff"/>
          <rect x="10" y="9" width="4" height="12" rx="1" fill="#ffffff"/>
          <rect x="17" y="4" width="4" height="17" rx="1" fill="#ffffff"/>
        </svg>
      </div>
      <div class="title-block">
        <h1 id="assetTitle">Market Dashboard</h1>
        <div class="sub" id="assetTicker">Historical Price &amp; Volume Analysis</div>
      </div>
    </div>
    <div class="asof">
      <div>Latest Close &middot; <span id="latestDate"></span></div>
      <span class="price" id="latestPrice"></span>
      <span class="chg" id="latestChg"></span>
    </div>
  </div>

  <div class="asset-tabs" id="assetTabs"></div>

  <div class="filters">
    <div class="filter-group">
      <label>Year</label>
      <select id="yearFilter"></select>
    </div>
    <div class="filter-group">
      <label>Metric</label>
      <select id="metricFilter">
        <option value="close">Close Price</option>
        <option value="avg">Average Price</option>
      </select>
    </div>
    <div class="range-note" id="rangeNote"></div>
  </div>

  <div class="kpis">
    <div class="kpi-card">
      <div class="label">All Time High <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="#b8842e" stroke-width="2"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
      <div class="value accent" id="athVal"></div>
      <div class="foot">Intraday high, all history</div>
    </div>
    <div class="kpi-card">
      <div class="label">All Time Low <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="#767a82" stroke-width="2"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg></div>
      <div class="value" id="atlVal"></div>
      <div class="foot">Intraday low, all history</div>
    </div>
    <div class="kpi-card">
      <div class="label">Average Close <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="#b8842e" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg></div>
      <div class="value" id="avgVal"></div>
      <div class="foot" id="avgFoot"></div>
    </div>
    <div class="kpi-card">
      <div class="label">Total Volume <svg class="kpi-icon" viewBox="0 0 24 24" fill="none" stroke="#b8842e" stroke-width="2"><rect x="3" y="10" width="4" height="10"/><rect x="10" y="6" width="4" height="14"/><rect x="17" y="3" width="4" height="17"/></svg></div>
      <div class="value" id="volVal"></div>
      <div class="foot" id="volFoot"></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-title">Quarterly Average Price <span class="tag">Bar</span></div>
      <div class="chart-box"><canvas id="quarterlyChart"></canvas></div>
    </div>
    <div class="panel">
      <div class="panel-title">Monthly Price Trend <span class="tag">Area</span></div>
      <div class="chart-box"><canvas id="monthlyChart"></canvas></div>
    </div>
    <div class="panel wide">
      <div class="panel-title" id="yearlyTitle">Price Trend <span class="tag">Line</span></div>
      <div class="chart-box" style="height:280px;"><canvas id="yearlyChart"></canvas></div>
    </div>
    <div class="panel wide">
      <div class="panel-title">Volume Trend <span class="tag">Bar</span></div>
      <div class="chart-box" style="height:220px;"><canvas id="volumeChart"></canvas></div>
    </div>
  </div>

  <div class="footer-note" id="footerNote"></div>
</div>

const ASSET_KEYS = Object.keys(DATA);

let currentAsset = ASSET_KEYS[0];

const fmt = (n, unit) => unit + n.toLocaleString(undefined,{maximumFractionDigits: Math.abs(n) < 10 ? 2 : 0});
const fmtVol = n => {
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(2)+'K';
  return n.toString();
};

Chart.defaults.color = '#767a82';
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
Chart.defaults.borderColor = '#e5e3dc';
const gridOpt = {color:'#ececE4', drawTicks:false};

function makeGradient(ctx, area, c1, c2){
  const g = ctx.createLinearGradient(0,area.top,0,area.bottom);
  g.addColorStop(0,c1); g.addColorStop(1,c2);
  return g;
}

).join('');

  tab.addEventListener('click', ()=>{
    currentAsset = tab.getAttribute('data-asset');
    tabsEl.querySelectorAll('.asset-tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    renderAsset();
  });
});

let quarterlyChart, monthlyChart, yearlyChart, volumeChart;

function filteredQuarterly(assetData, year){
  if(year==='all') return assetData.quarterly;
  return assetData.quarterly.filter(d=>String(d.Year)===String(year));
}
function filteredMonthly(assetData, year){
  if(year==='all') return assetData.monthly;
  return assetData.monthly.filter(d=>d.YM.startsWith(String(year)));
}

function buildYearlyChart(assetData, unit){
  const ctx = document.getElementById('yearlyChart');
  if(yearlyChart) yearlyChart.destroy();
  yearlyChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: assetData.weekly.map(d=>d.Date),
      datasets:[{
        label:'Close',
        data: assetData.weekly.map(d=>d.close),
        borderColor:'#b8842e',
        backgroundColor:'rgba(184,132,46,0.08)',
        borderWidth:2,
        pointRadius:0,
        fill:true,
        tension:0.15
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{mode:'index', intersect:false, callbacks:{label:c=>fmt(c.parsed.y, unit)}}},
      scales:{
        x:{ticks:{maxTicksLimit:10, callback:function(v){ const lbl=this.getLabelForValue(v); return lbl.slice(0,4); }}, grid:gridOpt},
        y:{grid:gridOpt, ticks:{callback:v=>unit+v.toLocaleString()}}
      }
    }
  });
}

function buildVolumeChart(assetData){
  const ctx = document.getElementById('volumeChart');
  if(volumeChart) volumeChart.destroy();
  volumeChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels: assetData.monthly.map(d=>d.YM),
      datasets:[{
        label:'Volume',
        data: assetData.monthly.map(d=>d.volume),
        backgroundColor:'#b8842e',
        borderRadius:2,
        barThickness:5
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>fmtVol(c.parsed.y)}}},
      scales:{
        x:{ticks:{maxTicksLimit:12, callback:function(v){ const lbl=this.getLabelForValue(v); return lbl.slice(0,4); }}, grid:{display:false}},
        y:{grid:gridOpt, ticks:{callback:v=>fmtVol(v)}}
      }
    }
  });
}

function buildQuarterlyChart(assetData, unit){
  const ctx = document.getElementById('quarterlyChart');
  const yr = document.getElementById('yearFilter').value;
  const metric = document.getElementById('metricFilter').value;
  const rows = filteredQuarterly(assetData, yr);
  if(quarterlyChart) quarterlyChart.destroy();
  quarterlyChart = new Chart(ctx, {
    type:'bar',
    data:{
      labels: rows.map(d=>d.label),
      datasets:[{
        label: metric==='close'?'Close':'Average',
        data: rows.map(d=>d[metric]),
        backgroundColor: ctx=>{
          const {chart} = ctx;
          const {ctx:c, chartArea} = chart;
          if(!chartArea) return '#b8842e';
          return makeGradient(c, chartArea, '#cfa34e', '#8a6218');
        },
        borderRadius:6,
        maxBarThickness:42
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label: c=> fmt(c.parsed.y, unit)}}},
      scales:{
        x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:12}},
        y:{grid:gridOpt, ticks:{callback:v=>unit+v.toLocaleString()}}
      }
    }
  });
}

function buildMonthlyChart(assetData, unit){
  const ctx = document.getElementById('monthlyChart');
  const yr = document.getElementById('yearFilter').value;
  const metric = document.getElementById('metricFilter').value;
  const rows = filteredMonthly(assetData, yr);
  if(monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: rows.map(d=>d.YM),
      datasets:[{
        label: metric==='close'?'Close':'Average',
        data: rows.map(d=>d[metric]),
        borderColor:'#b8842e',
        backgroundColor: ctx=>{
          const {chart} = ctx;
          const {ctx:c, chartArea} = chart;
          if(!chartArea) return 'rgba(184,132,46,0.15)';
          return makeGradient(c, chartArea, 'rgba(184,132,46,0.35)', 'rgba(184,132,46,0.02)');
        },
        borderWidth:2,
        pointRadius:2,
        pointBackgroundColor:'#b8842e',
        fill:true,
        tension:0.25
      }]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label: c=> fmt(c.parsed.y, unit)}}},
      scales:{
        x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:12}},
        y:{grid:gridOpt, ticks:{callback:v=>unit+v.toLocaleString()}}
      }
    }
  });
}

function populateYearFilter(assetData){
  const years = [...new Set(assetData.yearly.map(d=>d.Year))].sort();
  const sel = document.getElementById('yearFilter');
  const prevVal = sel.value;
  sel.innerHTML = '<option value="all">All Years</option>' + years.map(y=>`<option value="${y}">${y}</option>`).join('');
  sel.value = years.includes(Number(prevVal)) ? prevVal : 'all';
}

function renderAsset(){
  const assetData = DATA[currentAsset];
  const meta = META[currentAsset];
  const unit = meta.unit;

  document.getElementById('assetTitle').textContent = meta.label + ' Dashboard';
  document.getElementById('assetTicker').textContent = meta.ticker + ' \u00b7 Historical Price & Volume Analysis';
  document.getElementById('yearlyTitle').innerHTML = 'Price Trend, Full History <span class="tag">Line</span>';

  document.getElementById('latestDate').textContent = assetData.kpi.latest_date;
  document.getElementById('latestPrice').textContent = fmt(assetData.kpi.latest_close, unit);
  const chgEl = document.getElementById('latestChg');
  const chg = assetData.kpi.ytd_change_pct;
  chgEl.textContent = (chg>=0?'+':'') + chg + '% YTD';
  chgEl.className = 'chg ' + (chg>=0?'pos':'neg');

  document.getElementById('athVal').textContent = fmt(assetData.kpi.all_time_high, unit);
  document.getElementById('atlVal').textContent = fmt(assetData.kpi.all_time_low, unit);
  document.getElementById('avgVal').textContent = fmt(assetData.kpi.avg_close, unit);
  document.getElementById('avgFoot').textContent = 'Across ' + assetData.kpi.records.toLocaleString() + ' trading days';
  document.getElementById('volVal').textContent = fmtVol(assetData.kpi.total_volume);
  document.getElementById('volFoot').textContent = assetData.kpi.start_date + ' \u2192 ' + assetData.kpi.end_date;
  document.getElementById('rangeNote').textContent = assetData.kpi.start_date + ' to ' + assetData.kpi.end_date;
  document.getElementById('footerNote').innerHTML = 'Source: Power_BI_Data.xlsx (' + currentAsset + ' sheet) &middot; ' + assetData.kpi.start_date + ' to ' + assetData.kpi.end_date + ' &middot; ' + assetData.kpi.records.toLocaleString() + ' records';

  populateYearFilter(assetData);
  buildYearlyChart(assetData, unit);
  buildVolumeChart(assetData);
  buildQuarterlyChart(assetData, unit);
  buildMonthlyChart(assetData, unit);
}

document.getElementById('yearFilter').addEventListener('change', ()=>{
  const assetData = DATA[currentAsset];
  const unit = META[currentAsset].unit;
  buildQuarterlyChart(assetData, unit);
  buildMonthlyChart(assetData, unit);
});
document.getElementById('metricFilter').addEventListener('change', ()=>{
  const assetData = DATA[currentAsset];
  const unit = META[currentAsset].unit;
  buildQuarterlyChart(assetData, unit);
  buildMonthlyChart(assetData, unit);
});

renderAsset();
</script>
</body>
</html>
